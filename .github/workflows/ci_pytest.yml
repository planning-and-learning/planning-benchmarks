name: pytest

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        # pypddl for the generator tests' strict parse checks (not a package dependency: cycle)
        run: pip install 'pypddl>=1.0.27,<1.1' -e ".[test]"
      - name: Run tests
        run: pytest tests
