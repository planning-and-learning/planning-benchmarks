[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypddl-datasets"
dynamic = ["version"]
description = "Download PDDL planning benchmark suites: classical, numeric, profiling, and learning splits."
readme = "README.md"
# The FF-collection ports listed in src/pypddl_datasets/generators/CREDITS.md
# keep their original non-commercial notice (LicenseRef-Freiburg).
license = "GPL-3.0-or-later AND LicenseRef-Freiburg"
license-files = ["LICENSES/*"]
requires-python = ">=3.10"
authors = [{ name = "Dominik Drexler", email = "dominik.drexler@liu.se" }]
dependencies = [
    "pooch>=1.8",
    "typing-extensions>=4.4",  # typing.override backport for py<3.12 (requires-python is 3.10)
]

[project.optional-dependencies]
test = ["pytest"]

[dependency-groups]
# pypddl: strict parse checks in tests and import resolution for the linters
# (not a package dependency: it would be a cycle).
dev = [
    "pytest",
    "pypddl>=1.0.27,<1.1",
    "pyright==1.1.411",
    "pylint==4.0.9",
]

[project.urls]
Homepage = "https://github.com/planning-and-learning/planning-benchmarks"

[tool.hatch.version]
path = "src/pypddl_datasets/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pypddl_datasets"]
# repository tooling: importable in the checkout, never shipped
exclude = [
    "src/pypddl_datasets/validation",
    "src/pypddl_datasets/scripts",
]

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSES"]

[tool.pylint.main]
jobs = 0

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
# design/duplicate-code: the generators are ports whose structure is frozen by
# the draw order of their random choices, and ipc/autoscale/ipc_learning
# variants repeat code on purpose. Docstrings are not enforced by pylint.
disable = [
    "design",
    "duplicate-code",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]
